<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="bodyClip">
      <ellipse cx="100" cy="118" rx="64" ry="56"/>
    </clipPath>
  </defs>
  <g stroke="#4b2a5c" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <!-- antennae (perked up) -->
    <path d="M84 68 Q76 40 58 26" fill="none"/>
    <path d="M116 68 Q124 40 142 26" fill="none"/>
    <circle cx="56" cy="24" r="9" fill="#ff5c9a"/>
    <circle cx="144" cy="24" r="9" fill="#ff5c9a"/>

    <!-- wings (raised) -->
    <ellipse cx="48" cy="64" rx="31" ry="22" transform="rotate(-38 48 64)" fill="#e9e1ff"/>
    <ellipse cx="152" cy="64" rx="31" ry="22" transform="rotate(38 152 64)" fill="#e9e1ff"/>

    <!-- stinger -->
    <path d="M92 170 L100 186 L108 170 Z" fill="#4b2a5c"/>

    <!-- body -->
    <ellipse cx="100" cy="118" rx="64" ry="56" fill="#ffd23f"/>
  </g>

  <g clip-path="url(#bodyClip)" fill="#4b2a5c">
    <rect x="30" y="136" width="140" height="12"/>
    <rect x="30" y="156" width="140" height="12"/>
  </g>
  <ellipse cx="100" cy="118" rx="64" ry="56" fill="none" stroke="#4b2a5c" stroke-width="6"/>

  <!-- shines -->
  <path d="M33 62 Q38 52 48 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M167 62 Q162 52 152 48" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <path d="M58 98 Q62 82 76 74" fill="none" stroke="#fff6cf" stroke-width="6" stroke-linecap="round"/>

  <!-- happy closed eyes ^ ^ -->
  <path d="M70 110 Q80 96 90 110" fill="none" stroke="#4b2a5c" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 110 Q120 96 130 110" fill="none" stroke="#4b2a5c" stroke-width="6" stroke-linecap="round"/>

  <!-- cheeks (stronger) -->
  <ellipse cx="64" cy="122" rx="10" ry="7" fill="#ff8fb8"/>
  <ellipse cx="136" cy="122" rx="10" ry="7" fill="#ff8fb8"/>

  <!-- big open smile -->
  <path d="M86 118 Q100 118 114 118 Q113 138 100 138 Q87 138 86 118 Z" fill="#4b2a5c" stroke="#4b2a5c" stroke-width="4" stroke-linejoin="round"/>
  <path d="M92 131 Q100 125 108 131 Q104 136 100 136 Q96 136 92 131 Z" fill="#ff8fb8"/>

  <!-- sparkles -->
  <g fill="#ff5c9a">
    <path d="M178 96 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path d="M20 104 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 Z"/>
  </g>
</svg>
